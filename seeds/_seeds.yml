version: 2

seeds:
  - name: ai4i2020
    description: >
      Raw AI4I 2020 Predictive Maintenance dataset (UCI Machine Learning Repository, id 601),
      loaded exactly as published: 10,000 synthetic machine sensor readings with failure labels.
      Column names keep the original spaces and units, they are standardised in bronze.
    columns:
      - name: UDI
        quote: true
        description: Unique identifier of the reading (1 to 10,000).
        data_tests:
          - unique
          - not_null

  - name: ref_product_types
    description: >
      Reference data for the three product quality variants (L / M / H) as described in the
      dataset paper, including the overstrain threshold that applies to each variant.
    columns:
      - name: product_type_code
        data_tests: [unique, not_null]

  - name: ref_failure_modes
    description: >
      Reference data for the five failure modes in the dataset, plus UNK for failures that
      carry no failure-mode label.
    columns:
      - name: failure_mode_code
        data_tests: [unique, not_null]
